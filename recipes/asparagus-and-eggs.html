    <h1>Asparagus and Eggs</h1>
    <img src="/img/asparagus-egg.webp" alt="A plate of asparagus spears and two sunny-side-up eggs on a simple white plate, with a soft natural light setting and a clean kitchen counter background. The asparagus is green and tender, and the eggs are golden with bright yolks. The scene feels fresh, simple, and appetizing." width="300">
    <h2>Ingredients</h2>
    <ul>
        <li>Asparagus</li>
        <li>Eggs</li>
        <li>Salt</li>
        <li>Pepper</li>
    </ul>
    <h2>Instructions</h2>
    <ol>
        <li>Boil the asparagus until tender.</li>
        <li>Fry the eggs to your liking.</li>
        <li>Season with salt and pepper.</li>
        <li>Serve the asparagus with the eggs.</li>
    </ol>
